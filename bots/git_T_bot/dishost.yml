name: git_T_bot
language: python
startup: python main.py
memory: 256
cpu: 25
disk: 512
env:
  DISCORD_BOT_TOKEN: ""
  DISCORD_GUILD_ID: ""
  DISCORD_ADMIN_CHANNEL_ID: ""
  DISCORD_ALLOWED_ROLE_IDS: ""
  GITHUB_TOKEN: ""
  GITHUB_WEBHOOK_MASTER_SECRET: ""
  GITHUB_WEBHOOK_PUBLIC_URL: ""
  GITHUB_WEBHOOK_PATH: "/webhooks/github"
  WEBHOOK_HOST: "0.0.0.0"
  WEBHOOK_PORT: "8080"
  WATCH_TARGETS: ""
  COMMAND_PREFIX: "!"
  STARTUP_NOTIFY: "true"
  PY_PACKAGES: "discord.py aiohttp python-dotenv"
git:
  autoDeploy: true
  branch: dev
