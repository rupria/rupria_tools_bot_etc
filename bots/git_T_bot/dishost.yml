name: git_T_bot
language: python
startup: python main.py
memory: 256
cpu: 25
disk: 512
env:
  DISCORD_BOT_TOKEN: ""
  DISCORD_GUILD_ID: ""
  DISCORD_ADMIN_CHANNEL_ID: ""
  DISCORD_ALLOWED_ROLE_IDS: ""
  GITHUB_TOKEN: ""
  WATCH_POLL_INTERVAL_MS: "60000"
  WATCH_TARGETS: "rupria/rupria_tools_bot_etc|main|YOUR_CHANNEL_ID"
  COMMAND_PREFIX: "!"
  STARTUP_NOTIFY: "true"
  PY_PACKAGES: "discord.py aiohttp python-dotenv"
git:
  autoDeploy: true
  branch: main
